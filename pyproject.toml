[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quorix-question-pipeline"
version = "0.2.0"
description = "Local Python question-generation pipeline for Quorix"
requires-python = ">=3.11"

[project.scripts]
quorix-question = "python_pipeline.cli:main"

[tool.setuptools]
packages = ["python_pipeline"]
